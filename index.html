<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ניהול שעות עבודה</title>
  <style>
    :root {
      --primary-color: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --success-color: #16a34a;
      --danger-color: #dc2626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: var(--card-bg);
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
      border: 1px solid var(--border-color);
    }

    .hidden {
      display: none !important;
    }

    h2, h3 {
      color: var(--text-main);
      margin-bottom: 12px;
    }

    .form-group {
      margin-bottom: 14px;
      text-align: right;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    input, select {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.95rem;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--primary-color);
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    .btn-secondary {
      background-color: #e2e8f0;
      color: #334155;
      width: auto;
      padding: 6px 12px;
      font-size: 0.8rem;
    }

    .btn-danger {
      background-color: var(--danger-color);
      color: white;
      width: auto;
      padding: 6px 10px;
      font-size: 0.8rem;
    }

    .header-flex {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .summary-box {
      background-color: #f0fdf4;
      border: 1px solid #bbf7d0;
      padding: 14px;
      border-radius: 8px;
      display: flex;
      justify-content: space-around;
      text-align: center;
      margin-bottom: 16px;
    }

    .summary-item .title {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .summary-item .value {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--success-color);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      margin-top: 10px;
    }

    th, td {
      padding: 10px 6px;
      text-align: right;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      background-color: #f8fafc;
      color: var(--text-muted);
    }

    .section-card {
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .details-row {
      background-color: #f8fafc;
      display: none;
    }

    .details-row.active {
      display: table-row;
    }

    .details-content {
      padding: 8px 10px;
      font-size: 0.75rem;
      color: #334155;
      line-height: 1.5;
    }

    .details-content ul {
      padding-right: 15px;
    }
  </style>
</head>
<body>

  <!-- מסך התחברות -->
  <div id="loginScreen" class="container">
    <h2 style="text-align: center;">ניהול שעות עבודה</h2>
    <p style="text-align: center; color: var(--text-muted); font-size: 0.85rem; margin-bottom: 20px;">הזן שם משתמש כדי להתחיל</p>
    
    <div class="form-group">
      <label>שם משתמש:</label>
      <input type="text" id="userInput" placeholder="הקלד שם משתמש...">
    </div>
    
    <button onclick="handleLogin()">כניסה למערכת</button>
  </div>

  <!-- מסך ניהול השעות -->
  <div id="appScreen" class="container hidden">
    
    <div class="header-flex">
      <div>
        <h3 id="welcomeTitle" style="margin: 0;">שלום</h3>
        <span style="font-size: 0.75rem; color: var(--text-muted);">ניהול שכר חודשי</span>
      </div>
      <button class="btn-secondary" onclick="handleLogout()">החלף משתמש</button>
    </div>

    <!-- הגדרת בונוס -->
    <div class="section-card">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span style="font-size: 0.85rem;">בסיס: 35.4 ₪ + בונוס: <strong id="bonusDisplay">4.6</strong> ₪</span>
        <button class="btn-secondary" onclick="toggleBonusEdit()">שנה בונוס</button>
      </div>
      <div id="bonusBox" class="hidden" style="margin-top: 10px;">
        <label>סכום בונוס לשעת חול (₪):</label>
        <input type="number" id="bonusInput" value="4.6" step="0.1" onchange="saveBonus()">
      </div>
    </div>

    <!-- הוספת משמרת -->
    <div class="section-card">
      <h3>הוספת משמרת</h3>
      <div class="form-group">
        <label>תאריך:</label>
        <input type="date" id="shiftDate">
      </div>
      <div class="form-group">
        <label>סוג משמרת:</label>
        <select id="shiftType">
          <option value="weekday">יום חול</option>
          <option value="saturday">שבת</option>
        </select>
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <div class="form-group">
          <label>התחלה:</label>
          <input type="time" id="startTime" value="08:00">
        </div>
        <div class="form-group">
          <label>סיום:</label>
          <input type="time" id="endTime" value="16:00">
        </div>
      </div>
      <button onclick="addShift()">הוסף משמרת</button>
    </div>

    <!-- סיכום -->
    <div class="section-card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <h3 style="margin: 0;">סיכום חודשי</h3>
        <input type="month" id="monthFilter" onchange="renderApp()" style="width: auto; padding: 4px;">
      </div>
      <div class="summary-box">
        <div class="summary-item">
          <div class="title">סה"כ שעות</div>
          <div class="value" id="sumHours">0.00</div>
        </div>
        <div class="summary-item">
          <div class="title">שכר משוער</div>
          <div class="value"><span id="sumPay">0.00</span> ₪</div>
        </div>
      </div>
    </div>

    <!-- טבלה -->
    <div>
      <h3>פירוט משמרות</h3>
      <table>
        <thead>
          <tr>
            <th>תאריך</th>
            <th>שעות</th>
            <th>שכר</th>
            <th>פירוט</th>
            <th>מחיקה</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="5" style="text-align: center; color: var(--text-muted);">אין משמרות בחודש זה</td></tr>
        </tbody>
      </table>
    </div>

  </div>

<script>
let currentUser = localStorage.getItem('active_user') || '';
let shifts = [];

document.getElementById('shiftDate').valueAsDate = new Date();
document.getElementById('monthFilter').value = new Date().toISOString().slice(0, 7);

if (currentUser) {
  showApp();
}

function handleLogin() {
  const val = document.getElementById('userInput').value.trim();
  if (!val) {
    alert("נא להזין שם משתמש");
    return;
  }
  currentUser = val;
  localStorage.setItem('active_user', currentUser);
  showApp();
}

function handleLogout() {
  localStorage.removeItem('active_user');
  currentUser = '';
  document.getElementById('userInput').value = '';
  document.getElementById('appScreen').classList.add('hidden');
  document.getElementById('loginScreen').classList.remove('hidden');
}

function showApp() {
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('appScreen').classList.remove('hidden');
  document.getElementById('welcomeTitle').innerText = `שלום, ${currentUser}`;
  
  const savedBonus = localStorage.getItem(`bonus_${currentUser}`);
  if (savedBonus !== null) {
    document.getElementById('bonusInput').value = savedBonus;
    document.getElementById('bonusDisplay').innerText = savedBonus;
  }

  shifts = JSON.parse(localStorage.getItem(`shifts_${currentUser}`)) || [];
  renderApp();
}

function toggleBonusEdit() {
  const box = document.getElementById('bonusBox');
  box.classList.toggle('hidden');
}

function saveBonus() {
  const b = document.getElementById('bonusInput').value;
  localStorage.setItem(`bonus_${currentUser}`, b);
  document.getElementById('bonusDisplay').innerText = b;
  recalculateAll();
}

function calculatePay(type, startStr, endStr, bonusRate) {
  let [sh, sm] = startStr.split(':').map(Number);
  let [eh, em] = endStr.split(':').map(Number);

  let startMinutes = sh * 60 + sm;
  let endMinutes = eh * 60 + em;
  if (endMinutes <= startMinutes) endMinutes += 24 * 60;

  const BASE_CALC = 35.4;
  const BASE_WEEKDAY = BASE_CALC + Number(bonusRate);
  const SAT_CUTOFF_MINUTES = 19 * 60;

  let totalPay = 0;
  let totalMinutes = endMinutes - startMinutes;
  let breakdown = {};

  let currentMinute = startMinutes;
  let minuteCount = 0;

  while (currentMinute < endMinutes) {
    minuteCount++;
    let currentHourInShift = Math.ceil(minuteCount / 60);
    let minuteOfDay = currentMinute % (24 * 60);
    
    let rateForMinute = 0;
    let categoryKey = '';

    if (type === 'weekday') {
      if (currentHourInShift <= 8) {
        rateForMinute = BASE_WEEKDAY / 60;
        categoryKey = `שעות בסיס (${BASE_WEEKDAY.toFixed(2)} ₪)`;
      } else if (currentHourInShift <= 10) {
        rateForMinute = (BASE_CALC * 1.25) / 60;
        categoryKey = `שעות נוספות 125% (${(BASE_CALC * 1.25).toFixed(2)} ₪)`;
      } else {
        rateForMinute = (BASE_CALC * 1.50) / 60;
        categoryKey = `שעות נוספות 150% (${(BASE_CALC * 1.50).toFixed(2)} ₪)`;
      }
    } else {
      let isBeforeSatCutoff = minuteOfDay < SAT_CUTOFF_MINUTES;

      if (isBeforeSatCutoff) {
        if (currentHourInShift <= 8) {
          rateForMinute = (BASE_CALC * 1.50) / 60;
          categoryKey = `שבת 150% (${(BASE_CALC * 1.50).toFixed(2)} ₪)`;
        } else {
