<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ניהול שעות עבודה</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --success-color: #16a34a;
            --danger-color: #dc2626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 520px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border-color);
        }

        .hidden {
            display: none !important;
        }

        h2,
        h3 {
            color: var(--text-main);
            margin-bottom: 12px;
        }

        .form-group {
            margin-bottom: 14px;
            text-align: right;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: #e2e8f0;
            color: #334155;
            width: auto;
            padding: 6px 12px;
            font-size: 0.8rem;
        }

        .btn-danger {
            background-color: var(--danger-color);
            color: white;
            width: auto;
            padding: 6px 10px;
            font-size: 0.8rem;
        }

        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .summary-box {
            background-color: #f0fdf4;
            border: 1px solid #bbf7d0;
            padding: 14px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: center;
            margin-bottom: 16px;
        }

        .summary-row {
            display: flex;
            justify-content: space-around;
        }

        .summary-item .title {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .summary-item .value {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--success-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            margin-top: 10px;
        }

        th,
        td {
            padding: 10px 6px;
            text-align: right;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: #f8fafc;
            color: var(--text-muted);
        }

        .section-card {
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .details-row {
            background-color: #f8fafc;
            display: none;
        }

        .details-row.active {
            display: table-row;
        }

        .details-content {
            padding: 8px 10px;
            font-size: 0.75rem;
            color: #334155;
            line-height: 1.5;
        }

        .details-content ul {
            padding-right: 15px;
        }
    </style>
</head>

<body>

    <!-- מסך התחברות -->
    <div id="loginScreen" class="container">
        <h2 style="text-align: center;">ניהול שעות עבודה</h2>
        <p style="text-align: center; color: var(--text-muted); font-size: 0.85rem; margin-bottom: 20px;">הזן שם משתמש
            כדי להתחיל</p>

        <div class="form-group">
            <label>שם משתמש:</label>
            <input type="text" id="userInput" placeholder="הקלד שם משתמש...">
        </div>

        <button id="loginBtn" type="button">כניסה למערכת</button>
    </div>

    <!-- מסך ניהול השעות -->
    <div id="appScreen" class="container hidden">

        <div class="header-flex">
            <div>
                <h3 id="welcomeTitle" style="margin: 0;">שלום</h3>
                <span style="font-size: 0.75rem; color: var(--text-muted);">ניהול שכר חודשי</span>
            </div>
            <button id="logoutBtn" class="btn-secondary" type="button">החלף משתמש</button>
        </div>

        <!-- הגדרות בונוס ונסיעות -->
        <div class="section-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <span style="font-size: 0.85rem;">בסיס: 35.4 ₪ + בונוס: <strong id="bonusDisplay">4.6</strong> ₪</span>
                <button id="toggleSettingsBtn" class="btn-secondary" type="button">הגדרות שכר ונסיעות</button>
            </div>
            <div id="settingsBox" class="hidden"
                style="display: flex; flex-direction: column; gap: 10px; margin-top: 10px; background: #f8fafc; padding: 10px; border-radius: 8px;">
                <div class="form-group" style="margin:0;">
                    <label>בונוס לשעת חול (₪):</label>
                    <input type="number" id="bonusInput" value="4.6" step="0.1">
                </div>
                <div class="form-group" style="margin:0;">
                    <label>נסיעות יומיות (₪):</label>
                    <input type="number" id="travelInput" value="10" step="1">
                </div>
            </div>
        </div>

        <!-- הוספת משמרת -->
        <div class="section-card">
            <h3>הוספת משמרת</h3>
            <div class="form-group">
                <label>תאריך:</label>
                <input type="date" id="shiftDate">
            </div>
            <div class="form-group">
                <label>סוג משמרת:</label>
                <select id="shiftType">
                    <option value="weekday">יום חול</option>
                    <option value="saturday">שבת</option>
                </select>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div class="form-group">
                    <label>התחלה:</label>
                    <input type="time" id="startTime" value="08:00">
                </div>
                <div class="form-group">
                    <label>סיום:</label>
                    <input type="time" id="endTime" value="16:00">
                </div>
            </div>
            <button id="addShiftBtn" type="button">הוסף משמרת</button>
        </div>

        <!-- סיכום -->
        <div class="section-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <h3 style="margin: 0;">סיכום חודשי</h3>
                <input type="month" id="monthFilter" style="width: auto; padding: 4px;">
            </div>
            <div class="summary-box">
                <div class="summary-row">
                    <div class="summary-item">
                        <div class="title">סה"כ שעות</div>
                        <div class="value" id="sumHours">0:00</div>
                    </div>
                    <div class="summary-item">
                        <div class="title">שכר משוער</div>
                        <div class="value"><span id="sumPay">0.00</span> ₪</div>
                    </div>
                </div>
                <div class="summary-row" style="border-top: 1px solid #bbf7d0; padding-top: 6px;">
                    <div class="summary-item">
                        <div class="title">סה"כ משמרות</div>
                        <div class="value" id="sumShiftsCount">0</div>
                    </div>
                    <div class="summary-item">
                        <div class="title">סה"כ נסיעות</div>
                        <div class="value"><span id="sumTravel">0</span> ₪</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- טבלה -->
        <div>
            <h3>פירוט משמרות</h3>
            <table>
                <thead>
                    <tr>
                        <th>תאריך</th>
                        <th>שעות</th>
                        <th>שכר</th>
                        <th>פירוט</th>
                        <th>מחיקה</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="5" style="text-align: center; color: var(--text-muted);">אין משמרות בחודש זה</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            let currentUser = localStorage.getItem('active_user') || '';
            let shifts = [];

            const today = new Date();
            const dateInput = document.getElementById('shiftDate');
            const monthFilterInput = document.getElementById('monthFilter');

            if (dateInput) dateInput.valueAsDate = today;
            if (monthFilterInput) monthFilterInput.value = today.toISOString().slice(0, 7);

            document.getElementById('loginBtn').addEventListener('click', handleLogin);
            document.getElementById('logoutBtn').addEventListener('click', handleLogout);
            document.getElementById('toggleSettingsBtn').addEventListener('click', toggleSettings);
            document.getElementById('addShiftBtn').addEventListener('click', addShift);
            document.getElementById('bonusInput').addEventListener('input', saveSettings);
            document.getElementById('travelInput').addEventListener('input', saveSettings);
            if (monthFilterInput) monthFilterInput.addEventListener('change', renderApp);

            document.getElementById('userInput').addEventListener('keypress', function (e) {
                if (e.key === 'Enter') handleLogin();
            });

            if (currentUser) {
                showApp();
            }

            function handleLogin() {
                const val = document.getElementById('userInput').value.trim();
                if (!val) {
                    alert("נא להזין שם משתמש");
                    return;
                }
                currentUser = val;
                localStorage.setItem('active_user', currentUser);
                showApp();
            }

            function handleLogout() {
                localStorage.removeItem('active_user');
                currentUser = '';
                document.getElementById('userInput').value = '';
                document.getElementById('appScreen').classList.add('hidden');
                document.getElementById('loginScreen').classList.remove('hidden');
            }

            function showApp() {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('appScreen').classList.remove('hidden');
                document.getElementById('welcomeTitle').innerText = `שלום, ${currentUser}`;

                const savedBonus = localStorage.getItem(`bonus_${currentUser}`);
                const savedTravel = localStorage.getItem(`travel_${currentUser}`);

                document.getElementById('bonusInput').value = savedBonus !== null ? savedBonus : "4.6";
                document.getElementById('bonusDisplay').innerText = document.getElementById('bonusInput').value;
                document.getElementById('travelInput').value = savedTravel !== null ? savedTravel : "10";

                shifts = JSON.parse(localStorage.getItem(`shifts_${currentUser}`)) || [];
                renderApp();
            }

            function toggleSettings() {
                const box = document.getElementById('settingsBox');
                box.classList.toggle('hidden');
            }

            function saveSettings() {
                const b = document.getElementById('bonusInput').value;
                const t = document.getElementById('travelInput').value;
                localStorage.setItem(`bonus_${currentUser}`, b);
                localStorage.setItem(`travel_${currentUser}`, t);
                document.getElementById('bonusDisplay').innerText = b;
                recalculateAll();
            }

            function formatMinutesToHours(totalMinutes) {
                const hours = Math.floor(totalMinutes / 60);
                const minutes = totalMinutes % 60;
                return `${hours}:${minutes < 10 ? '0' : ''}${minutes}`;
            }

            function timeStrToMin(timeStr) {
                const [h, m] = timeStr.split(':').map(Number);
                return h * 60 + m;
            }

            function minToTimeStr(min) {
                const h = Math.floor(min / 60) % 24;
                const m = min % 60;
                return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
            }

            function calculateIntervalsPay(type, startMin, endMin, bonusRate) {
                if (endMin <= startMin) endMin += 24 * 60;

                const BASE_CALC = 35.4;
                const BASE_WEEKDAY = BASE_CALC + Number(bonusRate || 4.6);
                const SAT_CUTOFF_MINUTES = 19 * 60;

                let totalPay = 0;
                let totalMinutes = endMin - startMin;
                let breakdownSegments = [];

                let currentMinute = startMin;
                let minuteCount = 0;

                let currentCategory = '';
                let segmentStartMin = currentMinute;
                let segmentMinutes = 0;
                let segmentSum = 0;

                while (currentMinute < endMin) {
                    minuteCount++;
                    let currentHourInShift = Math.ceil(minuteCount / 60);
                    let minuteOfDay = currentMinute % (24 * 60);

                    let rateForMinute = 0;
                    let categoryKey = '';

                    if (type === 'weekday') {
                        if (currentHourInShift <= 8) {
                            rateForMinute = BASE_WEEKDAY / 60;
                            categoryKey = `שעות בסיס (${BASE_WEEKDAY.toFixed(2)} ₪)`;
                        } else if (currentHourInShift <= 10) {
                            rateForMinute = (BASE_CALC * 1.25) / 60;
                            categoryKey = `שעות נוספות 125% (${(BASE_CALC * 1.25).toFixed(2)} ₪)`;
                        } else {
                            rateForMinute = (BASE_CALC * 1.50) / 60;
                            categoryKey = `שעות נוספות 150% (${(BASE_CALC * 1.50).toFixed(2)} ₪)`;
                        }
                    } else {
                        let isBeforeSatCutoff = minuteOfDay < SAT_CUTOFF_MINUTES;

                        if (isBeforeSatCutoff) {
                            if (currentHourInShift <= 8) {
                                rateForMinute = (BASE_CALC * 1.50) / 60;
                                categoryKey = `שבת 150% (${(BASE_CALC * 1.50).toFixed(2)} ₪)`;
                            } else {
                                rateForMinute = (BASE_CALC * 1.75) / 60;
                                categoryKey = `שעות נוספות שבת 175% (${(BASE_CALC * 1.75).toFixed(2)} ₪)`;
                            }
                        } else {
                            if (currentHourInShift <= 8) {
                                rateForMinute = BASE_WEEKDAY / 60;
                                categoryKey = `מוצ"ש רגיל (${BASE_WEEKDAY.toFixed(2)} ₪)`;
                            } else {
                                rateForMinute = (BASE_CALC * 1.50) / 60;
                                categoryKey = `נוספות מוצ"ש 150% (${(BASE_CALC * 1.50).toFixed(2)} ₪)`;
                            }
                        }
                    }

                    totalPay += rateForMinute;

                    if (currentCategory === '') {
                        currentCategory = categoryKey;
                        segmentStartMin = currentMinute;
                        segmentMinutes = 1;
                        segmentSum = rateForMinute;
                    } else if (currentCategory === categoryKey) {
                        segmentMinutes++;
                        segmentSum += rateForMinute;
                    } else {
                        breakdownSegments.push({
                            title: currentCategory,
                            start: minToTimeStr(segmentStartMin),
                            end: minToTimeStr(currentMinute),
                            minutes: segmentMinutes,
                            sum: segmentSum
                        });
                        currentCategory = categoryKey;
                        segmentStartMin = currentMinute;
                        segmentMinutes = 1;
                        segmentSum = rateForMinute;
                    }

                    currentMinute++;
                }

                if (segmentMinutes > 0) {
                    breakdownSegments.push({
                        title: currentCategory,
                        start: minToTimeStr(segmentStartMin),
                        end: minToTimeStr(endMin),
                        minutes: segmentMinutes,
                        sum: segmentSum
                    });
                }

                let detailsList = breakdownSegments.map(seg => {
                    const formattedTime = formatMinutesToHours(seg.minutes);
                    return `${seg.title} (${seg.start} - ${seg.end}): ${formattedTime} ש' = ${seg.sum.toFixed(2)} ₪`;
                });

                return {
                    minutes: totalMinutes,
                    pay: totalPay,
                    details: detailsList
                };
            }

            function addShift() {
                const date = document.getElementById('shiftDate').value;
                const type = document.getElementById('shiftType').value;
                const startStr = document.getElementById('startTime').value;
                const endStr = document.getElementById('endTime').value;
                const bonus = document.getElementById('bonusInput').value;

                if (!date || !startStr || !endStr) {
                    alert("נא למלא את כל השדות");
                    return;
                }

                let newStartMin = timeStrToMin(startStr);
                let newEndMin = timeStrToMin(endStr);
                if (newEndMin <= newStartMin) newEndMin += 24 * 60;

                let existingShift = shifts.find(s => s.date === date);

                if (existingShift) {
                    let extStartMin = timeStrToMin(existingShift.rawStart);
                    let extEndMin = timeStrToMin(existingShift.rawEnd);
                    if (extEndMin <= extStartMin) extEndMin += 24 * 60;

                    let combinedStart = Math.min(newStartMin, extStartMin);
                    let combinedEnd = Math.max(newEndMin, extEndMin);

                    const res = calculatePayForUnified(type, combinedStart, combinedEnd, bonus);

                    existingShift.start = minToTimeStr(combinedStart);
                    existingShift.end = minToTimeStr(combinedEnd);
                    existingShift.rawStart = minToTimeStr(combinedStart);
                    existingShift.rawEnd = minToTimeStr(combinedEnd);
                    existingShift.minutes = res.minutes;
                    existingShift.pay = res.pay;
                    existingShift.details = res.details;
                } else {
                    const res = calculatePayForUnified(type, newStartMin, newEndMin, bonus);
                    shifts.push({
                        id: Date.now(),
                        date,
                        type,
                        start: startStr,
                        end: endStr,
                        rawStart: startStr,
                        rawEnd: endStr,
                        minutes: res.minutes,
                        pay: res.pay,
                        details: res.details
                    });
                }

                if (monthFilterInput) {
                    monthFilterInput.value = date.slice(0, 7);
                }

                saveAndRender();
            }

            function calculatePayForUnified(type, startMin, endMin, bonus) {
                return calculateIntervalsPay(type, startMin, endMin, bonus);
            }

            window.deleteShift = function (id) {
                shifts = shifts.filter(s => s.id !== id);
                saveAndRender();
            };

            window.toggleDetails = function (id) {
                const detailsRow = document.getElementById(`details-${id}`);
                if (detailsRow) {
                    detailsRow.classList.toggle('active');
                }
            };

            function recalculateAll() {
                const bonus = document.getElementById('bonusInput').value;
                shifts.forEach(s => {
                    let startMin = timeStrToMin(s.rawStart || s.start);
                    let endMin = timeStrToMin(s.rawEnd || s.end);
                    let res = calculateIntervalsPay(s.type, startMin, endMin, bonus);
                    s.minutes = res.minutes;
                    s.pay = res.pay;
                    s.details = res.details;
                });
                saveAndRender();
            }

            function saveAndRender() {
                localStorage.setItem(`shifts_${currentUser}`, JSON.stringify(shifts));
                renderApp();
            }

            function renderApp() {
                const tbody = document.getElementById('tableBody');
                const month = monthFilterInput ? monthFilterInput.value : new Date().toISOString().slice(0, 7);
                const filtered = shifts.filter(s => s.date.startsWith(month));

                tbody.innerHTML = '';
                if (filtered.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-muted);">אין משמרות בחודש זה</td></tr>`;
                    document.getElementById('sumHours').innerText = '0:00';
                    document.getElementById('sumPay').innerText = '0.00';
                    document.getElementById('sumShiftsCount').innerText = '0';
                    document.getElementById('sumTravel').innerText = '0';
                    return;
                }

                filtered.sort((a, b) => new Date(a.date) - new Date(b.date));

                let totalMinutesMonth = 0;
                let totalPayMonth = 0;
                const dailyTravelRate = Number(document.getElementById('travelInput').value) || 0;
                const totalTravelMonth = filtered.length * dailyTravelRate;

                filtered.forEach(s => {
                    totalMinutesMonth += s.minutes;
                    totalPayMonth += s.pay;

                    const formattedHours = formatMinutesToHours(s.minutes);

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
        <td>
          ${s.date.slice(8)}/${s.date.slice(5, 7)} (${s.type === 'weekday' ? 'חול' : 'שבת'})<br>
          <span style="font-size: 0.75rem; color: var(--text-muted);">${s.start}-${s.end}</span>
        </td>
        <td>${formattedHours} ש'</td>
        <td><strong>${s.pay.toFixed(2)}₪</strong></td>
        <td><button class="btn-secondary" type="button" onclick="toggleDetails(${s.id})">חישוב</button></td>
        <td><button class="btn-danger" type="button" onclick="deleteShift(${s.id})">מחק</button></td>
      `;

                    const detailsTr = document.createElement('tr');
                    detailsTr.id = `details-${s.id}`;
                    detailsTr.className = 'details-row';
                    detailsTr.innerHTML = `
        <td colspan="5">
          <div class="details-content">
            <strong>פירוט חישוב:</strong>
            <ul>
              ${s.details.map(d => `<li>• ${d}</li>`).join('')}
            </ul>
          </div>
        </td>
      `;

                    tbody.appendChild(tr);
                    tbody.appendChild(detailsTr);
                });

                document.getElementById('sumHours').innerText = formatMinutesToHours(totalMinutesMonth);
                document.getElementById('sumPay').innerText = totalPayMonth.toFixed(2);
                document.getElementById('sumShiftsCount').innerText = filtered.length;
                document.getElementById('sumTravel').innerText = totalTravelMonth.toFixed(0);
            }
        });
    </script>
</body>

</html>
